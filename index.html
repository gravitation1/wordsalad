<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <!-- The browser chrome's tint (the installed app's status bar, mobile
         Safari's tab bar), one per color scheme: the page background of
         each. The only place these colors are written; a manual theme
         override regates the pair (theme.js, themeColor.ts). -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
      data-scheme="light"
    />
    <meta
      name="theme-color"
      content="#030712"
      media="(prefers-color-scheme: dark)"
      data-scheme="dark"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The web app manifest is generated by the build (vite.config.ts) and
         linked from there, so its paths and this page's agree on the base. -->
    <title>Word Salad</title>
    <!-- External so the build's script-src 'self' needs no hashes; classic
         and render-blocking on purpose, to run before first paint. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
