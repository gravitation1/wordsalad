<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Word Salad</title>
    <script>
      // Stamp any saved theme override before first paint, so the loading
      // screen doesn't flash the OS theme. The app keeps it in sync after.
      try {
        var theme = localStorage.getItem('wordsalad:theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // No storage means no override to honor.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
