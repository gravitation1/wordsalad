<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The required-letter tile, the game's one filled shape: a W drawn as
       strokes, so it renders identically everywhere with no font. The
       maskable and Apple icons (public/icons/) are this on a full-bleed
       square; every PNG there is rendered from this geometry. -->
  <rect width="512" height="512" rx="112" fill="#0d9488"/>
  <polyline points="116,176 186,336 256,206 326,336 396,176" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
